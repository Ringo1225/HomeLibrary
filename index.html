<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>家庭书目</title>
  <meta name="theme-color" content="#ececee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家庭书目">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=4">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="shell layout">
  <aside class="side" aria-label="导航">
    <div class="brand"><i>书</i>家庭书目</div>
    <nav id="sideNav"></nav>
    <div class="tip"><b>录入新书</b>把书架照片发给 Claude，新书会自动加进来。</div>
  </aside>

  <div>
    <header class="head">
      <div class="head-top">
        <div id="headText"></div>
        <button class="skin-btn" id="skinBtn" type="button" aria-label="换一套配色"><span></span></button>
      </div>
    </header>
    <div class="searchbar" id="searchbar">
      <div class="search-row">
        <div class="search" id="searchBox">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="书名、作者或拼音" aria-label="搜索书目">
          <button class="clear" id="clear" type="button" aria-label="清空搜索"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <button class="fbtn" id="filterBtn" type="button" aria-haspopup="dialog" aria-controls="sheet" aria-expanded="false" aria-label="筛选和排序"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="dot" id="filterDot"></span></button>
      </div>
    </div>
    <main id="main"></main>
  </div>
</div>

<div class="rail" id="rail" hidden></div>
<div class="bubble" id="bubble"></div>

<nav class="tabbar" id="tabbar" aria-label="主导航"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" tabindex="-1" inert>
  <div class="sheet-toolbar">
    <div class="grab" aria-hidden="true"></div>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭弹窗"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="vendor/pinyin-pro.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
